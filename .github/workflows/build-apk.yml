name: Build and Release Emux32 ARM64 APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses & Install NDK / CMake
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

    - name: Ensure gradlew is executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_output.log || {
          echo "==================== BUILD FAILURE DETECTED ===================="
          tail -n 120 gradle_output.log
          exit 1
        }

    - name: Generate Dynamic Build Name
      if: success()
      run: |
        BUILD_TAG="Emux32_d$(TZ='Europe/Rome' date +'%d-%m_t%H-%M')"
        echo "BUILD_NAME=${BUILD_TAG}" >> $GITHUB_ENV
        echo "APK_NAME=${BUILD_TAG}.apk" >> $GITHUB_ENV
        echo "Generated Build Name: ${BUILD_TAG}"

    - name: Prepare Named APK
      if: success()
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk "${{ env.APK_NAME }}"
        cp app/build/outputs/apk/debug/app-debug.apk Emux32-app-debug.apk

    - name: Upload Debug APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BUILD_NAME }}
        path: |
          ${{ env.APK_NAME }}
          Emux32-app-debug.apk
        retention-days: 30

    - name: Publish Versioned GitHub Release
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.BUILD_NAME }}
        name: ${{ env.BUILD_NAME }}
        body: |
          ### Release Emux32: ${{ env.BUILD_NAME }}
          Compilazione automatica eseguita con successo.
          - **File APK**: `${{ env.APK_NAME }}`
          - **Commit**: `${{ github.sha }}`
          - **Architettura Host**: `ARM64-v8a`
          - **Architettura Guest**: `ARMv7-A` (32-bit DBT)
          - **Data e Ora (CET/CEST)**: ${{ env.BUILD_NAME }}
        files: |
          ${{ env.APK_NAME }}
          Emux32-app-debug.apk
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Latest Release Pointer
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Emux32 Latest Build (${{ env.BUILD_NAME }})
        body: |
          ### Release Automatica Continua (Ultimo Aggiornamento)
          Ultima build compilata: **${{ env.BUILD_NAME }}**
          - **File APK Principale**: `${{ env.APK_NAME }}`
          - **Commit**: `${{ github.sha }}`
        files: |
          ${{ env.APK_NAME }}
          Emux32-app-debug.apk
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Reports on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Failure-Logs
        path: gradle_output.log
        retention-days: 7
